name: tests

on:
  push:
    # A pull request runs its own copy; pushing its branch would run it twice.
    branches: [main]
    paths-ignore:
      - 'state/cloud-state.env'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes are billed at ten times the Linux rate on private
        # repositories, so a private deployment tests Linux and Windows only.
        # The public template still covers all three.
        os: ${{ fromJSON(github.event.repository.private && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Offline regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Dispatcher regression tests
        run: node --test tests/test_dispatch.mjs
